name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Builds only need source access. Fork pull requests run without write privileges.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Source and documentation (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check source syntax, local documentation and published audit counts
        run: python3 scripts/check_repository.py

  native:
    name: Compiler regressions (macOS arm64, LLVM 21.1.8)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check supported runner architecture
        run: test "$(uname -m)" = arm64
      - name: Cache only the verified-download archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Caching the 7.8 GiB extracted prefix wastes space and can reuse builds.
          # bootstrap.py rechecks this archive's digest on every invocation.
          path: .strictcpp/toolchains/LLVM-21.1.8-macOS-ARM64.tar.xz
          key: llvm-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/bootstrap.py') }}
      - name: Verify LLVM, extract it and build the compiler components
        id: bootstrap
        run: |
          python3 native/bootstrap.py
          llvm_prefix="$GITHUB_WORKSPACE/.strictcpp/toolchains/LLVM-21.1.8-macOS-ARM64"
          echo "STRICTCPP_LLVM=$llvm_prefix" >> "$GITHUB_ENV"
          # Use Apple's platform sanitizer runtime. The current macOS 26 image
          # supplies Apple Clang 21, compatible with the emitted LLVM 21 bitcode.
          echo "STRICTCPP_SANITIZER_CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
          # Standalone Clang does not inherit Apple's SDK search configuration.
          # The native builder sets -isysroot itself; AST commands need this
          # environment setting when they invoke standalone LLVM directly.
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
      - name: Run the complete regression suite
        run: |
          mkdir -p build/ci
          make test 2>&1 | tee build/ci/regressions.log
      - name: Run positive and deliberately trapped demonstrations
        run: make demo strict-demo
      - name: Check the runtime with ASan and UBSan
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          mkdir -p build/ci
          make verify-runtime 2>&1 | tee build/ci/sanitizers.log
      - name: Retain regression and sanitizer logs even after a failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-test-logs
          path: build/ci/*.log
          if-no-files-found: warn
          retention-days: 14
